type Location {
  coordinates: [Float!]
  city: String
  country: String
  address: String
}

type ListingAttributes {
  beds: Int
  bathrooms: Int
  max_guests: Int
  check_in_time: String
  check_out_time: String
  amenities: [String]
  minimum_nights: Int
  property_type: String
}

type Listing {
  _id: String!
  type: String!
  host_id: String!
  title: String!
  description: String!
  price: Int!
  location: Location
  attributes: ListingAttributes
  photos: [String]
  rating_avg: Float
  rating: Float
  availabilityRange: [String]
}

# Mirrors the domain union in lib/types/booking.ts and the booking_status_valid
# CHECK in db/migrations/004_booking_cancellation.sql.
enum BookingStatus {
  pending
  accepted
  rejected
  cancelled
}

# Mirrors BookingParty in lib/types/booking.ts: someone's side of *this*
# booking, not their roles — an account can be both guest and host (RF-02).
enum BookingParty {
  guest
  host
}

# A user as their counterparty may see them. Deliberately no email — mirrors
# UserSummary in lib/types/user.ts, not the wider PublicUser next to it.
type UserSummary {
  id: ID!
  name: String
}

type Booking {
  id: ID!
  created_at: String
  start_date: String
  end_date: String
  guests: Int
  status: BookingStatus
  status_reason: String
  total_price: Float
  refund_amount: Float
  cancelled_by: BookingParty
  cancelled_at: String
  # Which side of this booking the caller is on.
  party: BookingParty
  listing: Listing
  host: UserSummary
}

input LocationInput {
  type: String
  coordinates: [Float]
  city: String
  country: String
  address: String
}

input FiltersInput {
  own: Boolean # non customer faced
  limit: Int
  type: String
  term: String
  location: LocationInput
  rating: Float
  availabilityRange: [String]
  priceRange: [Float!]
  propertyType: String
  beds: Int
  bathrooms: Int
  maxGuests: Int
  amenities: [String!]
}

type Query {
  listings(filters: FiltersInput): [Listing!]
  listing(listing_id: String!): Listing
  # Bookings the caller made as a guest — their trips.
  guestBookings: [Booking]
  # A single booking, resolvable by either party to it.
  booking(id: ID!): Booking
}

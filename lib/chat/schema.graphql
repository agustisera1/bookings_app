type ChatMeta {
  id: ID!
  booking_id: ID!
  started_at: DateTime!
  guest_id: ID!
  host_id: ID!
}

type ChatMessage {
  id: ID!
  chat_id: ID!
  sender_id: ID!
  body: String!
  timestamp: DateTime!
}

# The newest messages of a thread. `olderCursor` loads one more page: null when there is none.
type ChatMessagePage {
  items: [ChatMessage!]!
  olderCursor: DateTime
}

# `chat` is null until someone speaks; `party` is the viewer's side of the booking.
type ChatThread {
  chat: ChatMeta
  messages: ChatMessagePage!
  party: BookingParty!
}

type Conversation {
  id: ID!
  title: String!
  photo: String
  start_date: DateTime!
  end_date: DateTime!
  status: BookingStatus!
  party: BookingParty!
}

extend type Query {
  conversations: [Conversation!]
  unreadMessagesCount: Int
  # A chat is keyed by its booking's id. `from` widens the thread back to that cursor.
  chatThread(id: ID!, from: DateTime): ChatThread
}

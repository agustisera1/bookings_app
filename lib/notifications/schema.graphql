type Notification {
  id: ID!
  listing_id: ID!
  host_id: ID!
  guest_id: ID!
  booking_id: ID!
  target_id: ID!
  title: String!
  body: String!
  is_read: Boolean!
  created_at: DateTime!
}

# Nullable: a failed read degrades to an error state instead of failing the whole query.
extend type Query {
  notifications: [Notification!]
  notificationsCount: Int
}
